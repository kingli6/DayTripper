openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: Server-side AI configuration operations
  - name: planning
    description: Bounded AI planning proposal operations
  - name: activities
    description: Day Tripper activity operations
  - name: board
    description: Persistent Board card operations
  - name: tasks
    description: Private task operations
  - name: journal
    description: Private timestamped journal operations
  - name: retention
    description: Private practice retention tracking operations
  - name: admin
    description: Protected development and operations diagnostics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: Get AI configuration status
      description: Returns safe metadata about the server-side Gemini configuration without exposing credentials
      responses:
        "200":
          description: AI configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
  /planning/proposals:
    post:
      operationId: createPlanningProposal
      tags: [planning]
      summary: Create a bounded planning proposal
      description: Creates a validated AI proposal without changing saved activities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningRequest"
      responses:
        "200":
          description: Validated planning proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningProposal"
        "400":
          description: Invalid planning request
        "502":
          description: The planning provider returned an invalid proposal
        "503":
          description: Planning service is unavailable
  /planning/discussion:
    post:
      operationId: createPlanningDiscussionReply
      tags: [planning]
      summary: Continue a private planning conversation
      description: Returns one bounded AI reply using only explicitly selected journal context without changing saved activities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningDiscussionRequest"
      responses:
        "200":
          description: Planning conversation reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningDiscussionResponse"
        "400":
          description: Invalid planning conversation
        "503":
          description: Planning service is unavailable
  /planning/replan-proposals:
    post:
      operationId: createReplanningProposal
      tags: [planning]
      summary: Create a controlled remaining-day proposal
      description: Creates a reviewable proposal for the remaining day without changing saved activities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplanningRequest"
      responses:
        "200":
          description: Validated remaining-day proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplanningProposal"
        "400":
          description: Invalid re-planning request
        "409":
          description: The requested day changed while the proposal was being prepared
        "502":
          description: The planning provider returned an invalid proposal
        "503":
          description: Planning service is unavailable
  /planning/replan-proposals/apply:
    post:
      operationId: applyReplanningProposal
      tags: [planning]
      summary: Apply selected changes from a controlled proposal
      description: Applies only explicitly selected changes when the saved schedule still matches the reviewed snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyReplanningProposalRequest"
      responses:
        "200":
          description: Applied re-planning changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyReplanningResult"
        "400":
          description: Invalid re-planning changes
        "409":
          description: The schedule changed since the proposal was created
        "404":
          description: One of the selected activities no longer exists
  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List activities for a day
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Activities for the requested day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Add an activity to a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
  /board-cards:
    get:
      operationId: listBoardCards
      tags: [board]
      summary: List active Board cards
      description: Returns the authenticated user's non-archived Board cards ordered by category and position
      responses:
        "200":
          description: Active Board cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardCard"
    post:
      operationId: createBoardCard
      tags: [board]
      summary: Create a Board card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardCardInput"
      responses:
        "201":
          description: Board card created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardCard"
  /board-cards/{id}:
    patch:
      operationId: updateBoardCard
      tags: [board]
      summary: Update a Board card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardCardUpdate"
      responses:
        "200":
          description: Board card updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardCard"
        "404":
          description: Board card not found
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List the user's non-archived tasks
      responses:
        "200":
          description: Tasks owned by the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: archiveTask
      tags: [tasks]
      summary: Archive a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Task archived
        "404":
          description: Task not found
  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
        "409":
          description: The Board card changed after the client last loaded it
    delete:
      operationId: archiveBoardCard
      tags: [board]
      summary: Archive a Board card
      description: Archives the card without deleting it permanently
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Board card archived
        "404":
          description: Board card not found
  /activities/{id}:
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "401":
          description: Authentication required
        "409":
          description: The activity changed after the client last loaded it
        "404":
          description: Activity not found
    delete:
      operationId: deleteActivity
      tags: [activities]
      summary: Delete an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Activity deleted
        "401":
          description: Authentication required
        "409":
          description: The activity changed after the client last loaded it
        "404":
          description: Activity not found
  /activity-changes:
    get:
      operationId: listActivityChanges
      tags: [activities]
      summary: List manual changes for a day
      description: Returns a private, chronological record of schedule changes for the requested day
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Schedule changes for the requested day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityChange"
    post:
      operationId: addActivityChangeNote
      tags: [activities]
      summary: Add an optional note to the change review
      description: Records an optional user explanation without changing the saved schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityChangeNoteInput"
      responses:
        "201":
          description: Review note saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityChange"
  /journal-entries:
    get:
      operationId: listJournalEntries
      tags: [journal]
      summary: List the user's journal entries
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: The user's private and planning-available journal entries. When date is provided, only entries recorded on that day are returned; when omitted, the full journal is returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Add a timestamped journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Linked activity not found
  /journal-entries/{id}:
    patch:
      operationId: updateJournalEntry
      tags: [journal]
      summary: Update journal entry visibility
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryUpdate"
      responses:
        "200":
          description: Journal entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Journal entry not found
    delete:
      operationId: deleteJournalEntry
      tags: [journal]
      summary: Delete a journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Journal entry deleted
        "404":
          description: Journal entry not found
  /journal-entries/planning-candidates:
    get:
      operationId: listPlanningJournalCandidates
      tags: [journal]
      summary: List journal entries available for planning
      description: Returns a bounded set of explicitly planning-available journal entries for the planning selection stage
      parameters:
        - name: currentDate
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Journal entries available for planning
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
  /retention/practices:
    get:
      operationId: listRetentionPractices
      tags: [retention]
      summary: List the user's retention practices
      description: Returns practices owned by the authenticated user
      responses:
        "200":
          description: Retention practices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetentionPractice"
    post:
      operationId: createRetentionPractice
      tags: [retention]
      summary: Create a retention practice
      description: Creates a numeric higher-is-better practice for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPracticeInput"
      responses:
        "201":
          description: Created retention practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPractice"
        "400":
          description: Invalid retention practice
  /retention/practices/{practiceId}:
    get:
      operationId: getRetentionPractice
      tags: [retention]
      summary: Get one retention practice
      description: Returns a practice owned by the authenticated user
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Retention practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPractice"
        "400":
          description: Invalid practice identifier
        "404":
          description: Retention practice not found
    patch:
      operationId: updateRetentionPractice
      tags: [retention]
      summary: Update a retention practice
      description: Updates editable practice details owned by the authenticated user
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPracticeUpdate"
      responses:
        "200":
          description: Updated retention practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPractice"
        "400":
          description: Invalid retention practice update
        "404":
          description: Retention practice not found
    delete:
      operationId: deleteRetentionPractice
      tags: [retention]
      summary: Delete a retention practice
      description: Deletes a practice and its recorded observations owned by the authenticated user
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Retention practice deleted
        "400":
          description: Invalid practice identifier
        "404":
          description: Retention practice not found
  /retention/practices/{practiceId}/observations:
    get:
      operationId: listRetentionObservations
      tags: [retention]
      summary: List observations for a retention practice
      description: Returns observations for a practice owned by the authenticated user
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Retention observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetentionObservation"
        "400":
          description: Invalid practice identifier
        "404":
          description: Retention practice not found
    post:
      operationId: createRetentionObservation
      tags: [retention]
      summary: Record a retention observation
      description: Records a numeric result for a practice owned by the authenticated user
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionObservationInput"
      responses:
        "201":
          description: Created retention observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionObservation"
        "400":
          description: Invalid retention observation
        "404":
          description: Retention practice not found
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get protected database diagnostics
      description: Returns protected aggregate account, table, database, and admin-action metrics without user-authored content
      responses:
        "200":
          description: Database diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Admin access is not configured for this account
  /admin/accounts/{accountId}/reset:
    post:
      operationId: resetAdminAccountData
      tags: [admin]
      summary: Reset one account's planner data
      description: Clears planner records for one selected account after an explicit confirmation phrase
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountResetRequest"
      responses:
        "200":
          description: Reset completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountResetResult"
        "400":
          description: Invalid reset confirmation
        "404":
          description: Account has no saved planner data
        "403":
          description: Admin access is not configured for this account
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiStatus:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        configured:
          type: boolean
        client:
          type: string
      required:
        - provider
        - model
        - configured
        - client
    PlanningRequest:
      type: object
      properties:
        intention:
          type: string
          minLength: 1
          maxLength: 2000
        currentDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        currentTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        availableTime:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/PlanningTimeWindow"
        planningStyle:
          type: ["string", "null"]
          enum: [lighter, balanced, fuller, null]
        fixedCommitments:
          type: ["string", "null"]
          maxLength: 2000
        includeJournalEntryIds:
          type: array
          maxItems: 20
          items:
            type: number
        considerJournalEntryIds:
          type: array
          maxItems: 20
          items:
            type: number
        discussionMessages:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/PlanningDiscussionMessage"
      required:
        - currentDate
        - currentTime
        - availableTime
    PlanningDiscussionMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 1200
      required:
        - role
        - content
    PlanningDiscussionRequest:
      type: object
      properties:
        currentDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        intention:
          type: ["string", "null"]
          maxLength: 2000
        currentTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        availableTime:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/PlanningTimeWindow"
        planningStyle:
          type: ["string", "null"]
          enum: [lighter, balanced, fuller, null]
        fixedCommitments:
          type: ["string", "null"]
          maxLength: 2000
        includeJournalEntryIds:
          type: array
          maxItems: 20
          items:
            type: number
        considerJournalEntryIds:
          type: array
          maxItems: 20
          items:
            type: number
        messages:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/PlanningDiscussionMessage"
      required:
        - currentDate
        - currentTime
        - availableTime
        - messages
    PlanningDiscussionResponse:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1600
        suggestedNextStep:
          type: string
          enum: [reply, proposal]
      required:
        - message
        - suggestedNextStep
    PlanningTimeWindow:
      type: object
      properties:
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        endTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
      required:
        - startTime
        - endTime
    PlanningProposal:
      type: object
      properties:
        proposedActivities:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ProposedActivity"
        buffers:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/PlanningTimeBlock"
        restPeriods:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/PlanningTimeBlock"
        assumptions:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 500
        conflicts:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/PlanningConflict"
        didNotFit:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/PlanningNotFittedItem"
      required:
        - proposedActivities
        - buffers
        - restPeriods
        - assumptions
        - conflicts
        - didNotFit
    ProposedActivity:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        scheduledDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        endTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        category:
          type: ["string", "null"]
          enum: [work, recovery, managing, social, fun, null]
        note:
          type: ["string", "null"]
          maxLength: 500
      required:
        - title
        - scheduledDate
        - startTime
        - endTime
        - category
        - note
    PlanningTimeBlock:
      type: object
      properties:
        scheduledDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        endTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - scheduledDate
        - startTime
        - endTime
        - reason
    PlanningConflict:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
        relatedActivityTitles:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 200
      required:
        - description
        - relatedActivityTitles
    PlanningNotFittedItem:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - title
        - reason
    ReplanningRequest:
      type: object
      properties:
        currentDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        currentTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        intention:
          type: string
          maxLength: 2000
        availableTime:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/PlanningTimeWindow"
        fixedCommitments:
          type: ["string", "null"]
          maxLength: 2000
        planningStyle:
          type: ["string", "null"]
          enum: [lighter, balanced, fuller, null]
      required:
        - currentDate
        - currentTime
