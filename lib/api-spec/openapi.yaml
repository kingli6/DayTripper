openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: Server-side AI configuration operations
  - name: activities
    description: Day Tripper activity operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: Get AI configuration status
      description: Returns safe metadata about the server-side Gemini configuration without exposing credentials
      responses:
        "200":
          description: AI configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List activities for a day
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Activities for the requested day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Add an activity to a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
  /activities/{id}:
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Activity not found
    delete:
      operationId: deleteActivity
      tags: [activities]
      summary: Delete an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Activity deleted
        "404":
          description: Activity not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiStatus:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        configured:
          type: boolean
        client:
          type: string
      required:
        - provider
        - model
        - configured
        - client
    Activity:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        scheduledDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        startTime:
          type: string
        endTime:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
          enum: [focused, managing, fun, social, break, null]
        completed:
          type: boolean
        note:
          type: ["string", "null"]
      required:
        - id
        - title
        - scheduledDate
        - startTime
        - endTime
        - category
        - completed
        - note
    ActivityInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        scheduledDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        startTime:
          type: string
        endTime:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
          enum: [focused, managing, fun, social, break, null]
        completed:
          type: boolean
        note:
          type: ["string", "null"]
      required:
        - title
        - scheduledDate
        - startTime
    ActivityUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        scheduledDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        startTime:
          type: string
        endTime:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
          enum: [focused, managing, fun, social, break, null]
        completed:
          type: boolean
        note:
          type: ["string", "null"]

