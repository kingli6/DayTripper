openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: Server-side AI configuration operations
  - name: planning
    description: Bounded AI planning proposal operations
  - name: activities
    description: Day Tripper activity operations
  - name: tasks
    description: Private task operations
  - name: retention
    description: Private practice retention tracking operations
  - name: execution
    description: Private execution observation and current-state operations
  - name: admin
    description: Protected development and operations diagnostics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: Get AI configuration status
      description: Returns safe metadata about the server-side Gemini configuration without exposing credentials
      responses:
        "200":
          description: AI configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
  /planning/proposals:
    post:
      operationId: createPlanningProposal
      tags: [planning]
      summary: Create a bounded planning proposal
      description: Creates a validated AI proposal without changing saved activities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningRequest"
      responses:
        "200":
          description: Validated planning proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningProposal"
        "400":
          description: Invalid planning request
        "502":
          description: The planning provider returned an invalid proposal
        "503":
          description: Planning service is unavailable
  /planning/discussion:
    post:
      operationId: createPlanningDiscussionReply
      tags: [planning]
      summary: Continue a private planning conversation
      description: Returns one bounded AI reply using the user's explicit planning context without changing saved activities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningDiscussionRequest"
      responses:
        "200":
          description: Planning conversation reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningDiscussionResponse"
        "400":
          description: Invalid planning conversation
        "503":
          description: Planning service is unavailable
  /planning/replan-proposals:
    post:
      operationId: createReplanningProposal
      tags: [planning]
      summary: Create a controlled remaining-day proposal
      description: Creates a reviewable proposal for the remaining day without changing saved activities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplanningRequest"
      responses:
        "200":
          description: Validated remaining-day proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplanningProposal"
        "400":
          description: Invalid re-planning request
        "409":
          description: The requested day changed while the proposal was being prepared
        "502":
          description: The planning provider returned an invalid proposal
        "503":
          description: Planning service is unavailable
  /planning/replan-proposals/apply:
    post:
      operationId: applyReplanningProposal
      tags: [planning]
      summary: Apply selected changes from a controlled proposal
      description: Applies only explicitly selected changes when the saved schedule still matches the reviewed snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyReplanningProposalRequest"
      responses:
        "200":
          description: Applied re-planning changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyReplanningResult"
        "400":
          description: Invalid re-planning changes
        "409":
          description: The schedule changed since the proposal was created
        "404":
          description: One of the selected activities no longer exists
  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List activities for a day
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: includeCompleted
          in: query
          required: false
          description: Include all activities with a recorded completion timestamp for Day Log views.
          schema:
            type: boolean
      responses:
        "200":
          description: Activities for the requested day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Add an activity to a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List the user's non-archived tasks
      responses:
        "200":
          description: Tasks owned by the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/recommend:
    post:
      operationId: recommendTasks
      tags: [tasks]
      summary: Recommend tasks for the user's current situation
      description: Uses Gemini when available and otherwise returns the deterministic task ranking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRecommendationInput"
      responses:
        "200":
          description: Up to three task recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRecommendationResponse"
        "400":
          description: Invalid recommendation inputs
  /tasks/triage:
    post:
      operationId: triageTasks
      tags: [tasks]
      summary: Sort an actionable list into the priority matrix
      description: Uses Gemini to classify each supplied line, preserving ambiguous or non-actionable items as unsorted for human review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTriageInput"
      responses:
        "200":
          description: Classified task list ready for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTriageResponse"
        "400":
          description: Invalid task list
        "502":
          description: The sorting provider returned an invalid response
        "503":
          description: Sorting service is unavailable
  /tasks/decision:
    post:
      operationId: decideExecutionTask
      tags: [tasks]
      summary: Decide what the user should work on next
      description: Returns one bounded execution decision using deterministic policy constraints, relevant user guidance, and Gemini when available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionDecisionInput"
      responses:
        "200":
          description: One concrete execution decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionDecision"
        "400":
          description: Invalid execution decision inputs
        "404":
          description: No active or inbox task is available
  /tasks/{id}/schedule:
    post:
      operationId: scheduleTask
      tags: [tasks]
      summary: Schedule an owned task into Today
      description: Creates a normal work Activity for an active task without completing or changing the task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskScheduleInput"
      responses:
        "201":
          description: Work activity created for the task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          description: Invalid schedule details
        "404":
          description: Active task not found
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: archiveTask
      tags: [tasks]
      summary: Archive a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Task archived
        "404":
          description: Task not found
  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskInput"
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: The recurring task occurrence has already advanced
        "404":
          description: Task not found
  /activities/{id}:
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "401":
          description: Authentication required
        "409":
          description: The activity changed after the client last loaded it
        "404":
          description: Activity not found
    delete:
      operationId: deleteActivity
      tags: [activities]
      summary: Delete an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Activity deleted
        "401":
          description: Authentication required
        "409":
          description: The activity changed after the client last loaded it
        "404":
          description: Activity not found
  /activity-changes:
    get:
      operationId: listActivityChanges
      tags: [activities]
      summary: List manual changes for a day
      description: Returns a private, chronological record of schedule changes for the requested day
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Schedule changes for the requested day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityChange"
    post:
      operationId: addActivityChangeNote
      tags: [activities]
      summary: Add an optional note to the change review
      description: Records an optional user explanation without changing the saved schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityChangeNoteInput"
      responses:
        "201":
          description: Review note saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityChange"
  /retention/practices:
    get:
      operationId: listRetentionPractices
      tags: [retention]
      summary: List the user's retention practices
      description: Returns practices owned by the authenticated user
      responses:
        "200":
          description: Retention practices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetentionPractice"
    post:
      operationId: createRetentionPractice
      tags: [retention]
      summary: Create a retention practice
      description: Creates a numeric higher-is-better practice for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPracticeInput"
      responses:
        "201":
          description: Created retention practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPractice"
        "400":
          description: Invalid retention practice
  /retention/practices/{practiceId}:
    get:
      operationId: getRetentionPractice
      tags: [retention]
      summary: Get one retention practice
      description: Returns a practice owned by the authenticated user
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Retention practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPractice"
        "400":
          description: Invalid practice identifier
        "404":
          description: Retention practice not found
    patch:
      operationId: updateRetentionPractice
      tags: [retention]
      summary: Update a retention practice
      description: Updates editable practice details owned by the authenticated user
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPracticeUpdate"
      responses:
        "200":
          description: Updated retention practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPractice"
        "400":
          description: Invalid retention practice update
        "404":
          description: Retention practice not found
    delete:
      operationId: deleteRetentionPractice
      tags: [retention]
      summary: Delete a retention practice
      description: Deletes a practice and its recorded observations owned by the authenticated user
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Retention practice deleted
        "400":
          description: Invalid practice identifier
        "404":
          description: Retention practice not found
  /retention/practices/{practiceId}/observations:
    get:
      operationId: listRetentionObservations
      tags: [retention]
      summary: List observations for a retention practice
      description: Returns observations for a practice owned by the authenticated user
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Retention observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetentionObservation"
        "400":
          description: Invalid practice identifier
        "404":
          description: Retention practice not found
    post:
      operationId: createRetentionObservation
      tags: [retention]
      summary: Record a retention observation
      description: Records a numeric result for a practice owned by the authenticated user
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionObservationInput"
      responses:
        "201":
          description: Created retention observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionObservation"
        "400":
          description: Invalid retention observation
        "404":
          description: Retention practice not found
  /execution/observations:
    get:
      operationId: listExecutionObservations
      tags: [execution]
      summary: List the user's execution observations
      description: Returns evidence-based observations owned by the authenticated user
      responses:
        "200":
          description: Execution observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExecutionObservation"
        "401":
          description: Authentication required
    post:
      operationId: createExecutionObservation
      tags: [execution]
      summary: Create an execution observation
      description: Records an evidence-based observation about how the authenticated user tends to work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionObservationInput"
      responses:
        "201":
          description: Execution observation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionObservation"
        "400":
          description: Invalid execution observation
        "401":
          description: Authentication required
  /execution/observations/{observationId}:
    patch:
      operationId: updateExecutionObservation
      tags: [execution]
      summary: Update an execution observation
      parameters:
        - name: observationId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionObservationUpdate"
      responses:
        "200":
          description: Execution observation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionObservation"
        "400":
          description: Invalid execution observation
        "401":
          description: Authentication required
        "404":
          description: Execution observation not found
    delete:
      operationId: deleteExecutionObservation
      tags: [execution]
      summary: Delete an execution observation
      description: Deletes an execution observation owned by the authenticated user
      parameters:
        - name: observationId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "204":
          description: Execution observation deleted
        "400":
          description: Invalid execution observation identifier
        "401":
          description: Authentication required
        "404":
          description: Execution observation not found
  /execution/state:
    get:
      operationId: getExecutionState
      tags: [execution]
      summary: Get the user's current execution state
      responses:
        "200":
          description: Current execution state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionState"
        "401":
          description: Authentication required
        "404":
          description: Current execution state has not been captured
    put:
      operationId: setExecutionState
      tags: [execution]
      summary: Set or update the user's current execution state
      description: Replaces only the supplied temporary state values and refreshes the capture time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionStateInput"
      responses:
        "200":
          description: Current execution state saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionState"
        "400":
          description: Invalid execution state
        "401":
          description: Authentication required
  /execution/sessions/active:
    get:
      operationId: getActiveExecutionSession
      tags: [execution]
      summary: Get the user's active execution session
      responses:
        "200":
          description: Active execution session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionSession"
        "401":
          description: Authentication required
        "404":
          description: No active execution session
  /execution/analysis:
    get:
      operationId: getExecutionAnalysis
      tags: [execution]
      summary: Analyze the user's terminal execution sessions
      description: Returns deterministic execution signals and candidate observations for later review
      responses:
        "200":
          description: Execution analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionAnalysis"
        "401":
          description: Authentication required
  /execution/sessions:
    post:
      operationId: startExecutionSession
      tags: [execution]
      summary: Start a bounded execution session for an owned task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionSessionInput"
      responses:
        "201":
          description: Execution session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionSession"
        "400":
          description: Invalid execution session
        "401":
          description: Authentication required
        "404":
          description: Task not found or not active
        "409":
          description: An active execution session already exists
  /execution/sessions/{sessionId}/complete:
    post:
      operationId: completeExecutionSession
      tags: [execution]
      summary: Complete an active execution session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Execution session completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionSession"
        "400":
          description: Execution session is not active
        "401":
          description: Authentication required
        "404":
          description: Execution session not found
  /execution/sessions/{sessionId}/stop:
    post:
      operationId: stopExecutionSession
      tags: [execution]
      summary: Stop an active execution session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Execution session stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionSession"
        "400":
          description: Execution session is not active
        "401":
          description: Authentication required
        "404":
          description: Execution session not found
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get protected database diagnostics
      description: Returns protected aggregate account, table, database, and admin-action metrics without user-authored content
      responses:
        "200":
          description: Database diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Admin access is not configured for this account
  /admin/accounts/{accountId}/reset:
    post:
      operationId: resetAdminAccountData
      tags: [admin]
      summary: Reset one account's planner data
      description: Clears planner records for one selected account after an explicit confirmation phrase
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountResetRequest"
      responses:
        "200":
          description: Reset completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountResetResult"
        "400":
          description: Invalid reset confirmation
        "404":
          description: Account has no saved planner data
        "403":
          description: Admin access is not configured for this account
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiStatus:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        configured:
          type: boolean
        client:
          type: string
      required:
        - provider
        - model
        - configured
        - client
    PlanningRequest:
      type: object
      properties:
        intention:
          type: string
          minLength: 1
          maxLength: 2000
        currentDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        currentTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        availableTime:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/PlanningTimeWindow"
        planningStyle:
          type: ["string", "null"]
          enum: [lighter, balanced, fuller, null]
        fixedCommitments:
          type: ["string", "null"]
          maxLength: 2000
        discussionMessages:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/PlanningDiscussionMessage"
      required:
        - currentDate
        - currentTime
        - availableTime
    PlanningDiscussionMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 1200
      required:
        - role
        - content
    PlanningDiscussionRequest:
      type: object
      properties:
        currentDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        intention:
          type: ["string", "null"]
          maxLength: 2000
        currentTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        availableTime:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/PlanningTimeWindow"
        planningStyle:
          type: ["string", "null"]
          enum: [lighter, balanced, fuller, null]
        fixedCommitments:
          type: ["string", "null"]
          maxLength: 2000
        messages:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/PlanningDiscussionMessage"
      required:
        - currentDate
        - currentTime
        - availableTime
        - messages
    PlanningDiscussionResponse:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1600
